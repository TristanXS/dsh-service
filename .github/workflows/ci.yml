name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install ShellCheck
        run: brew install shellcheck
      - name: Check Bash syntax
        run: /bin/bash -n bin/dsh-service libexec/dsh-service-run install.sh tests/*.sh
      - name: Run ShellCheck
        run: shellcheck -s bash bin/dsh-service libexec/dsh-service-run install.sh tests/*.sh
      - name: Run isolated tests
        run: /bin/bash tests/run.sh

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check Bash syntax
        run: /bin/bash -n bin/dsh-service libexec/dsh-service-run install.sh tests/*.sh
      - name: Run ShellCheck
        run: shellcheck -s bash bin/dsh-service libexec/dsh-service-run install.sh tests/*.sh
      - name: Run isolated tests
        run: /bin/bash tests/run.sh
